# Keeps the SHA-pinned actions in .github/workflows current.
# Dependabot opens a pull request when a pinned action has a new release;
# the pull request still has to pass the build check before it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
