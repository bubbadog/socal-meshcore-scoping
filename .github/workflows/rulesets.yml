name: rulesets

# Confirms that the files in .github/rulesets match the rulesets GitHub is enforcing.
# Runs weekly, on demand, and on any pull request that touches the ruleset files.
# Read-only: it reads the repository and the public rulesets API. No secrets.
on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/rulesets/**"
      - "tools/check_rulesets.py"

permissions:
  contents: read

concurrency:
  group: rulesets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: rulesets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruleset files match the live rulesets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 tools/check_rulesets.py
