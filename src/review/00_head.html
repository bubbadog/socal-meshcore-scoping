<title>Red-Team Review, Draft v3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one reading column, like an engineering audit sheet. Findings are numbered by severity; every claim carries a type chip and a numbered source. */
:root{
  --bg:#f3f5f7;--surface:#ffffff;--ink:#17212b;--ink2:#47525e;--rule:#d3dae1;--code:#eaeef2;
  --accent:#0a6c8a;--accent-soft:#e2eff3;
  --ok:#1f7a4d;--warn:#955800;--bad:#b3271f;--info:#3d55a6;--mute:#5d6975;--violet:#7245a6;--orange:#b04a10;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c;--surface:#18212a;--ink:#e6ebf0;--ink2:#a9b5c0;--rule:#2c3945;--code:#1e2a35;
  --accent:#56c2de;--accent-soft:#12303a;
  --ok:#62cf96;--warn:#e7ab52;--bad:#f27c73;--info:#93a9f2;--mute:#93a0ac;--violet:#c3a1ee;--orange:#f0955c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c;--surface:#18212a;--ink:#e6ebf0;--ink2:#a9b5c0;--rule:#2c3945;--code:#1e2a35;
  --accent:#56c2de;--accent-soft:#12303a;
  --ok:#62cf96;--warn:#e7ab52;--bad:#f27c73;--info:#93a9f2;--mute:#93a0ac;--violet:#c3a1ee;--orange:#f0955c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(3.2rem + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);padding-inline:16px;padding-block:0 4rem;-webkit-text-size-adjust:100%}
.wrap{max-width:47rem;margin-inline:auto;min-width:0}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre,kbd{font-family:var(--mono);font-size:.875em}
code{background:var(--code);padding:.05em .3em;border-radius:3px;overflow-wrap:anywhere}
h1,h2,h3,h4{text-wrap:balance;line-height:1.15;margin:0}
h1{font:700 clamp(2.1rem,6vw,3.1rem)/1.02 var(--display);letter-spacing:.005em;text-transform:uppercase}
h2{font:700 1.75rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin-top:3.4rem;padding-top:1.1rem;border-top:2px solid var(--ink)}
h3{font:600 1.12rem/1.3 var(--body);margin-top:1.9rem}
h4{font:600 .78rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:1.3rem}
p{margin:.7rem 0}
ul,ol{padding-left:1.25rem;margin:.6rem 0}
li{margin:.3rem 0}
.eyebrow{font:500 .78rem/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sub{color:var(--ink2);font-size:1.05rem;max-width:40rem}
.meta{font:400 .78rem/1.6 var(--mono);color:var(--ink2);border-block:1px solid var(--rule);padding-block:.55rem;margin-top:1.2rem;display:flex;flex-wrap:wrap;gap:.2rem 1.2rem}
header.top{padding-block:2.6rem 1rem}
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);margin-inline:-16px;padding-inline:16px}
nav.toc div{max-width:47rem;margin-inline:auto;display:flex;gap:1.1rem;overflow-x:auto;padding-block:.65rem;scrollbar-width:thin}
nav.toc a{font:500 .76rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--ink2);white-space:nowrap}
nav.toc a:hover{color:var(--accent)}
/* claim type chips */
.lb{display:inline-block;font:500 .66rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:.24em .45em .2em;border:1px solid currentColor;border-radius:2px;margin-right:.35em;vertical-align:.12em;white-space:nowrap}
.lb-p{color:var(--mute)}.lb-f{color:var(--ok)}.lb-c{color:var(--info)}.lb-i{color:var(--warn)}.lb-e{color:var(--orange)}.lb-o{color:var(--violet)}.lb-r{color:var(--accent)}.lb-u{color:var(--bad)}
.ct{font:400 .74em/1 var(--mono);color:var(--ink2);white-space:normal}
.ct a{text-decoration:none}.ct a:hover{text-decoration:underline}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.5rem 1.4rem;margin:1rem 0;padding:0;list-style:none;font-size:.9rem}
.legend li{margin:0;color:var(--ink2)}
.verdict{background:var(--surface);border:1px solid var(--rule);padding:1.1rem 1.25rem;margin-top:1.4rem}
.verdict p:first-child{margin-top:0}.verdict p:last-child{margin-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:1.2rem 0}
@media (max-width:46rem){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.tile:first-child{grid-column:span 2}}
@media (max-width:26rem){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);padding:.8rem .85rem}
.tile b{display:block;font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font:500 .68rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.tile.ok b{color:var(--ok)}.tile.cav b{color:var(--warn)}.tile.wrong b{color:var(--bad)}.tile.src b{color:var(--orange)}.tile.old b{color:var(--info)}.tile.unv b{color:var(--mute)}
/* findings */
.fd{margin-top:2.4rem;padding-top:1.3rem;border-top:1px solid var(--rule)}
.fd>header{display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;align-items:baseline}
.fd .n{font:700 2.3rem/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.fd h3{margin:0;font-size:1.22rem}
.sev{grid-column:2;font:500 .68rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase}
.sev.crit{color:var(--bad)}.sev.high{color:var(--orange)}.sev.med{color:var(--warn)}
.fix{background:var(--accent-soft);padding:.85rem 1rem;margin-top:1rem}
.fix>h4{margin-top:0;color:var(--accent)}
.fix p:last-child,.fix ul:last-child,.fix ol:last-child{margin-bottom:0}
.need{font-size:.9rem;color:var(--ink2);border-left:2px dotted var(--mute);padding-left:.8rem;margin-top:.9rem}
/* code blocks */
.cb{position:relative;margin:.8rem 0;border:1px solid var(--rule);background:var(--surface)}
.cb>.cap{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.4rem .7rem;border-bottom:1px solid var(--rule);font:500 .72rem/1.3 var(--mono);letter-spacing:.04em;color:var(--ink2)}
.cb pre{margin:0;padding:.75rem .8rem;overflow-x:auto;line-height:1.55;font-size:.84rem}
.cb pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.74rem;max-height:22rem;overflow-y:auto}
.cb button{font:500 .7rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:2px;padding:.35em .6em;cursor:pointer}
.cb button:hover{background:var(--accent);color:var(--surface)}
/* tables */
.tw{overflow-x:auto;margin:.9rem 0;border:1px solid var(--rule);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:.5rem .65rem;border-bottom:1px solid var(--rule)}
th{font:500 .7rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
/* ledger */
.flt{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.flt button{font:500 .72rem/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:.5em .7em;border:1px solid var(--rule);background:var(--surface);color:var(--ink2);border-radius:2px;cursor:pointer}
.flt button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.lg{display:grid;grid-template-columns:6.6rem minmax(0,1fr);gap:.2rem 1rem;padding:.95rem 0;border-top:1px solid var(--rule)}
.lg .vd{font:500 .68rem/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.lg .id{display:block;color:var(--ink2);margin-bottom:.25rem}
.lg[data-v="ok"] .vd b{color:var(--ok)}.lg[data-v="cav"] .vd b{color:var(--warn)}.lg[data-v="wrong"] .vd b{color:var(--bad)}.lg[data-v="src"] .vd b{color:var(--orange)}.lg[data-v="old"] .vd b{color:var(--info)}.lg[data-v="unv"] .vd b{color:var(--mute)}
.lg .cl{font-weight:500}
.lg p{margin:.3rem 0}
.lg .ev{color:var(--ink2);font-size:.92rem}
@media (max-width:34rem){.lg{grid-template-columns:1fr}}
/* charts */
.fig{margin:1.2rem 0;padding:1rem;border:1px solid var(--rule);background:var(--surface)}
.fig figcaption,.fig .cap{font-size:.84rem;color:var(--ink2);margin-top:.7rem}
.fig h4{margin-top:0}
.bars{display:grid;gap:.55rem;margin-top:.8rem}
.bar{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr) 3.4rem;gap:.1rem .7rem;align-items:center;font-size:.86rem}
.bt{height:.8rem;background:var(--code)}
.bt i{display:block;height:100%;background:var(--accent);border-radius:0 2px 2px 0}
.bv{font:500 .82rem/1 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.bn{grid-column:1/-1;font-size:.78rem;color:var(--ink2);margin-bottom:.15rem}
@media (max-width:34rem){.bar{grid-template-columns:minmax(0,1fr) 3.4rem}.bar .bl{grid-column:1/-1}}
.hops{display:flex;align-items:flex-end;gap:2px;height:9rem;margin-top:.9rem;border-bottom:1px solid var(--ink2);padding-bottom:1.2rem;position:relative}
.hb{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.hb i{display:block;background:var(--accent);min-height:1px;border-radius:2px 2px 0 0}
.hb.in i{opacity:.42}
.hb.med i{opacity:1;background:color-mix(in srgb,var(--accent) 42%,var(--surface));outline:2px solid var(--ink);outline-offset:-2px}
.hb b{position:absolute;bottom:-1.15rem;left:0;right:0;text-align:center;font:400 .58rem/1 var(--mono);color:var(--ink2)}
.key{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font:400 .74rem/1.3 var(--mono);color:var(--ink2);margin-top:.5rem}
.key i{display:inline-block;width:.7rem;height:.7rem;margin-right:.35rem;vertical-align:-.05rem}
.k1{background:var(--accent);opacity:.42}.k2{background:var(--surface);outline:2px solid var(--ink);outline-offset:-2px}.k3{background:var(--accent)}
/* works cited */
.wg{font:500 .78rem/1.4 var(--mono);letter-spacing:.04em;text-transform:none;color:var(--ink2);margin-top:1.6rem}
.refs{font-size:.86rem;padding-left:2.1rem}
.refs li{margin:.45rem 0;overflow-wrap:anywhere}
.refs li:target{background:var(--accent-soft);outline:6px solid var(--accent-soft)}
.refs a.u{font-family:var(--mono);font-size:.9em}
details{margin:.8rem 0}
summary{cursor:pointer;font-weight:500}
.small{font-size:.88rem;color:var(--ink2)}
footer.end{margin-top:3.5rem;padding-top:1rem;border-top:1px solid var(--rule);font-size:.84rem;color:var(--ink2)}
</style>
