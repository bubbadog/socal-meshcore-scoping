<title>SoCal MeshCore Scoping Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: dark hero, then a sticky map-and-search rail beside one reading column. Visual language follows the author's earlier drafts. */
:root{
  --bg:#f6f6f2;--surface:#ffffff;--ink:#14262b;--ink2:#4a5c61;--rule:#d6dcd9;--code:#eceeeb;
  --hero:#0f2a30;--hero-ink:#eef5f2;--hero-mute:#b4c6c3;--hero-line:#1d3f47;
  --accent:#b8480f;--accent-bright:#e0672f;--teal:#17666b;--teal-soft:#e2efed;--map:#e9eeeb;
  --c-f:#d5ece8;--t-f:#0f5a55;--c-i:#f6e8b8;--t-i:#6b5200;--c-r:#fbdcc9;--t-r:#8f380a;--c-u:#f6d3d0;--t-u:#8f1f18;
  --c-c:#dbe4f6;--t-c:#2d4691;--c-e:#f3dfc4;--t-e:#734400;--c-o:#e6dcf3;--t-o:#5a3691;--c-p:#e3e7e6;--t-p:#45555a;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a1d;--surface:#16252a;--ink:#e6eeec;--ink2:#a4b5b3;--rule:#2b3d42;--code:#1c2e33;
  --hero:#0b1f24;--hero-ink:#eef5f2;--hero-mute:#a9bdba;--hero-line:#18353c;
  --accent:#f08a55;--accent-bright:#f08a55;--teal:#5cc2c0;--teal-soft:#143237;--map:#1b2d32;
  --c-f:#12423f;--t-f:#9fe0d6;--c-i:#4a3d0c;--t-i:#f2d77a;--c-r:#522710;--t-r:#f7b592;--c-u:#53201c;--t-u:#f5a7a0;
  --c-c:#1f2f5c;--t-c:#a9bdf5;--c-e:#4a3410;--t-e:#f0c98a;--c-o:#35235a;--t-o:#cdb5f2;--c-p:#26363a;--t-p:#b9c7c5;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1d;--surface:#16252a;--ink:#e6eeec;--ink2:#a4b5b3;--rule:#2b3d42;--code:#1c2e33;
  --hero:#0b1f24;--hero-ink:#eef5f2;--hero-mute:#a9bdba;--hero-line:#18353c;
  --accent:#f08a55;--accent-bright:#f08a55;--teal:#5cc2c0;--teal-soft:#143237;--map:#1b2d32;
  --c-f:#12423f;--t-f:#9fe0d6;--c-i:#4a3d0c;--t-i:#f2d77a;--c-r:#522710;--t-r:#f7b592;--c-u:#53201c;--t-u:#f5a7a0;
  --c-c:#1f2f5c;--t-c:#a9bdf5;--c-e:#4a3410;--t-e:#f0c98a;--c-o:#35235a;--t-o:#cdb5f2;--c-p:#26363a;--t-p:#b9c7c5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:1rem}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font:400 17px/1.62 var(--body);margin:0;-webkit-text-size-adjust:100%}
a{color:var(--teal);text-underline-offset:2px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}
code,pre,kbd{font-family:var(--mono);font-size:.86em}
code{background:var(--code);padding:.06em .32em;border-radius:3px;overflow-wrap:anywhere}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:.75rem 0}
ul,ol{padding-left:1.3rem;margin:.6rem 0}
li{margin:.35rem 0}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-bottom:5px solid var(--accent-bright);padding-inline:16px;
  background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:28px 28px}
.hero-in{max-width:72rem;margin-inline:auto;padding-block:3.2rem 2.6rem;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:2rem 3rem;align-items:end}
.hero .eyebrow{font:500 .78rem/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--hero-mute);display:flex;align-items:center;gap:.6rem}
.hero .eyebrow::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:#f2b441;flex:none}
.hero h1{font:700 clamp(2.5rem,7vw,4.4rem)/1.02 var(--display);letter-spacing:-.015em;margin-top:.9rem}
.hero .lede{font-size:1.2rem;line-height:1.5;color:var(--hero-mute);max-width:40rem;margin-top:1.1rem}
.hero .status{border-left:3px solid var(--accent-bright);padding-left:1.1rem;font-size:.95rem;color:var(--hero-mute)}
.hero .status b{display:block;color:var(--hero-ink);font-size:1.05rem;margin-bottom:.3rem}
.hero .status a{color:var(--hero-ink)}
@media (max-width:52rem){.hero-in{grid-template-columns:minmax(0,1fr);padding-block:2.2rem 2rem}}
/* layout */
.shell{max-width:72rem;margin-inline:auto;padding-inline:16px;padding-block:2rem 4rem;display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:3rem}
.rail{position:sticky;top:calc(1rem + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 2rem);overflow-y:auto;padding-right:.3rem}
.rail h2{font:500 .72rem/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:1.2rem 0 .5rem;border:0;padding:0}
.rail nav a{display:block;padding:.34rem .7rem;border-left:2px solid var(--rule);color:var(--ink2);text-decoration:none;font-size:.9rem;line-height:1.3}
.rail nav a:hover{color:var(--ink);border-left-color:var(--accent-bright)}
.rail details>summary{display:none}
main{min-width:0;max-width:49rem}
@media (max-width:62rem){.shell{grid-template-columns:minmax(0,1fr);gap:1rem}.rail{position:sticky;top:0;z-index:5;background:var(--bg);margin-inline:-16px;padding:.6rem 16px .1rem;border-bottom:1px solid var(--rule);max-height:100vh;overflow:visible}
  html{scroll-padding-top:8.5rem}.search label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .rail details[open] nav{max-height:55vh;overflow-y:auto;padding-bottom:.6rem}.shell{padding-top:0}
  .rail details>summary{display:block;cursor:pointer;font:500 .78rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:.6rem 0}
  .rail details>summary::after{content:"  +"}.rail details[open]>summary::after{content:"  \2212"}
  .rail details:not([open]) nav{display:none}.rail .navh{display:none}}
/* search */
.search{display:grid;gap:.4rem}
.search label{font:500 .72rem/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.search input{width:100%;font:400 .95rem/1.2 var(--body);padding:.55rem .65rem;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink)}
.search .row{display:flex;align-items:center;gap:.4rem;font:400 .78rem/1 var(--mono);color:var(--ink2);min-height:1.7rem}
.search button,.btn{font:500 .74rem/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:.5em .7em;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.search button:hover,.btn:hover{border-color:var(--accent-bright)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--bg)}
mark.hit{background:#ffe08a;color:#14262b;padding:0 .05em;border-radius:2px}
mark.hit.cur{background:var(--accent-bright);color:#fff}
/* sections */
section{scroll-margin-top:1rem}
main>section{padding-top:2.6rem;margin-top:2.6rem;border-top:1px solid var(--rule)}
main>section:first-child{border-top:0;margin-top:0;padding-top:.4rem}
.num{font:500 .8rem/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h2{font:700 clamp(1.8rem,4.2vw,2.5rem)/1.1 var(--display);letter-spacing:-.01em;margin-top:.35rem}
h3{font:600 1.18rem/1.3 var(--body);margin-top:2rem}
h4{font:500 .76rem/1.35 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-top:1.3rem}
.lead{font-size:1.14rem;color:var(--ink2)}
.small{font-size:.88rem;color:var(--ink2)}
/* chips */
.lb{display:inline-block;font:500 .66rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:.34em .55em .3em;border-radius:3px;margin-right:.4em;vertical-align:.14em;white-space:nowrap}
.lb-f{background:var(--c-f);color:var(--t-f)}.lb-i{background:var(--c-i);color:var(--t-i)}.lb-r{background:var(--c-r);color:var(--t-r)}.lb-u{background:var(--c-u);color:var(--t-u)}
.lb-c{background:var(--c-c);color:var(--t-c)}.lb-e{background:var(--c-e);color:var(--t-e)}.lb-o{background:var(--c-o);color:var(--t-o)}.lb-p{background:var(--c-p);color:var(--t-p)}
.ct{font:400 .74em/1 var(--mono);color:var(--ink2)}
.ct a{text-decoration:none}.ct a:hover{text-decoration:underline}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.45rem 1.4rem;margin:1rem 0;padding:.9rem 1rem;list-style:none;font-size:.9rem;background:var(--teal-soft);border-radius:6px}
.legend li{margin:0;color:var(--ink2)}
/* summary blocks */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:1.2rem 0}

.sum>div{background:var(--surface);padding:1rem 1.1rem}
.sum b.k{display:block;font:700 1.9rem/1.05 var(--display);font-variant-numeric:tabular-nums}
.sum span.l{font-size:.9rem;color:var(--ink2)}
.callout{background:var(--surface);border:1px solid var(--rule);padding:1rem 1.2rem;margin:1.2rem 0}
.callout>:first-child{margin-top:0}.callout>:last-child{margin-bottom:0}
.note{background:var(--teal-soft);padding:1.1rem 1.3rem;margin:1.2rem 0;border-radius:6px}
.note p{margin:.6rem 0}.note .sig{font:500 .82rem/1.4 var(--mono);color:var(--ink2)}
.need{font-size:.9rem;color:var(--ink2);border-left:2px dotted var(--ink2);padding-left:.8rem;margin-top:1rem}
.steps{list-style:none;padding:0;margin:1.2rem 0;display:grid;gap:0}
.steps>li{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.2rem .9rem;margin:0;padding:0 0 1.1rem;position:relative}
.steps>li::before{content:"";position:absolute;left:1.05rem;top:2.1rem;bottom:0;width:2px;background:var(--rule)}
.steps>li:last-child::before{display:none}
.steps .dotn{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--hero);color:var(--hero-ink);display:grid;place-items:center;font:500 .8rem/1 var(--mono)}
.steps .gate{display:block;font-size:.88rem;color:var(--ink2);margin-top:.25rem}
.steps .gate b{font:500 .68rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:.4em}
/* code */
.cb{position:relative;margin:.9rem 0;border:1px solid var(--rule);background:var(--surface);border-radius:4px;overflow:hidden}
.cb>.cap{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.45rem .75rem;border-bottom:1px solid var(--rule);font:500 .74rem/1.35 var(--mono);color:var(--ink2)}
.cb pre{margin:0;padding:.8rem .85rem;overflow-x:auto;line-height:1.55;font-size:.86rem}
.cb pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.76rem;max-height:20rem;overflow-y:auto}
.cb button{font:500 .7rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--teal);background:transparent;border:1px solid var(--teal);border-radius:3px;padding:.38em .6em;cursor:pointer;flex:none}
/* tables */
.tw{overflow-x:auto;margin:1rem 0;border:1px solid var(--rule);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:.55rem .7rem;border-bottom:1px solid var(--rule)}
th{font:500 .7rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;background:var(--teal-soft)}
tr:last-child td{border-bottom:0}
td.num{font:inherit;letter-spacing:0;text-transform:none;color:inherit;font-variant-numeric:tabular-nums;white-space:nowrap}
/* figures */
.fig{margin:1.4rem 0;padding:1.1rem;border:1px solid var(--rule);background:var(--surface);border-radius:6px}
.fig h4{margin-top:0}
.fig figcaption{font-size:.86rem;color:var(--ink2);margin-top:.8rem}
.fig svg{display:block;max-width:100%;height:auto;color:var(--ink);margin-top:.6rem}
.sx{overflow-x:auto}.swipe{display:none;font:400 .74rem/1.3 var(--mono);color:var(--ink2);margin:.4rem 0 0}
@media (max-width:44rem){.sx svg{min-width:39rem;max-width:none}.swipe{display:block}}
svg text{font-family:var(--body);fill:currentColor}
svg .bx{fill:var(--bg);stroke:currentColor;stroke-width:1.4}
svg .bx.hot{fill:var(--c-r);stroke:var(--accent-bright)}
svg .bx.ok{fill:var(--c-f);stroke:var(--teal)}
svg .bx.dim{stroke-dasharray:5 4}
svg .ln{stroke:currentColor;stroke-width:1.6;fill:none}
svg .ln.hot{stroke:var(--accent-bright)}
svg .ln.dash{stroke-dasharray:6 5}
svg .ah{fill:currentColor}
svg .ah.hot{fill:var(--accent-bright)}
svg .t-s{font-size:12px}.t-m{font-size:13.5px;font-weight:600}
svg .t-mut{fill:var(--ink2)}
svg .t-mono{font-family:var(--mono);font-size:12px}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem 1.4rem;margin-top:1rem}
@media (max-width:40rem){.maps{grid-template-columns:minmax(0,1fr)}}
.mapp h4{margin:0 0 .2rem}.mapp p{margin:.3rem 0 0}
svg .cty{fill:var(--map);stroke:var(--ink2);stroke-width:1;stroke-linejoin:round}
svg .dot{fill:var(--accent-bright)}
svg .dot.sm{fill:var(--teal)}
svg .ring{fill:none;stroke:var(--ink2);stroke-width:2}
svg .ring.fillbg{fill:var(--surface);stroke:currentColor}
svg .sq{fill:var(--teal)}
svg .tri{fill:none;stroke:currentColor;stroke-width:2}
svg .lnk{stroke:var(--ink2);stroke-linecap:round}
svg .lead{stroke:var(--ink2);stroke-width:1}
svg .mlb{font-family:var(--mono);font-size:21px;font-weight:500}
svg .mlb.cn{font-size:16px}
svg .mlb.big{font-size:24px}
svg .mlb.tiny{font-size:11.5px;font-weight:400}
svg .mlb.em{font-weight:600}
.bars{display:grid;gap:.55rem;margin-top:.8rem}
.bar{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr) 3.6rem;gap:.1rem .7rem;align-items:center;font-size:.88rem}
.bt{height:.85rem;background:var(--code)}
.bt i{display:block;height:100%;background:var(--teal);border-radius:0 2px 2px 0}
.bv{font:500 .82rem/1 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.bn{grid-column:1/-1;font-size:.8rem;color:var(--ink2);margin-bottom:.15rem}
@media (max-width:34rem){.bar{grid-template-columns:minmax(0,1fr) 3.6rem}.bar .bl{grid-column:1/-1}}
.hops{display:flex;align-items:flex-end;gap:2px;height:9rem;margin-top:.9rem;border-bottom:1px solid var(--ink2);padding-bottom:1.2rem;position:relative}
.hb{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.hb i{display:block;background:var(--teal);min-height:1px;border-radius:2px 2px 0 0}
.hb.in i{opacity:.42}
.hb.med i{opacity:1;background:color-mix(in srgb,var(--teal) 42%,var(--surface));outline:2px solid var(--ink);outline-offset:-2px}
.hb b{position:absolute;bottom:-1.15rem;left:0;right:0;text-align:center;font:400 .58rem/1 var(--mono);color:var(--ink2)}
.key{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font:400 .76rem/1.3 var(--mono);color:var(--ink2);margin-top:.5rem}
.key i{display:inline-block;width:.7rem;height:.7rem;margin-right:.35rem;vertical-align:-.05rem}
.k1{background:var(--teal);opacity:.42}.k2{background:var(--surface);outline:2px solid var(--ink);outline-offset:-2px}.k3{background:var(--teal)}
.kd{border-radius:50%;background:var(--accent-bright)}.ks{background:var(--teal)}.kr{border-radius:50%;border:2px solid var(--ink2)}
/* feedback */
.fb{display:grid;gap:.9rem;margin:1.2rem 0}
.fb label{display:grid;gap:.3rem;font-size:.9rem;font-weight:500}
.fb input,.fb select,.fb textarea{font:400 1rem/1.4 var(--body);padding:.6rem .7rem;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink);width:100%}
.fb textarea{min-height:9rem;resize:vertical}
.fb .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.9rem}
.fb .acts{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.fb output{font-size:.86rem;color:var(--ink2)}
/* works cited */
.wg{font:500 .8rem/1.4 var(--mono);letter-spacing:.03em;text-transform:none;color:var(--ink2);margin-top:1.6rem}
.refs{font-size:.88rem;padding-left:2.2rem}
.refs li{margin:.45rem 0;overflow-wrap:anywhere}
.refs li:target{background:var(--teal-soft);outline:6px solid var(--teal-soft)}
.refs a.u{font-family:var(--mono);font-size:.9em}
details{margin:.8rem 0}
summary{cursor:pointer;font-weight:500}

@media print{.rail,.fb .acts,.cb button{display:none}.shell{display:block}.hero{background:none;color:#000}}
</style>
